name: Retrieve New Drive Files

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  retrieve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # Always start from the latest main
      - name: Sync latest main state & assets
        run: |
          git fetch origin main

          rm -rf state \
            Assets/_Game/02_Art/Sprite \
            Assets/_Game/03_Audio

          mkdir -p \
            state \
            Assets/_Game/02_Art/Sprite \
            Assets/_Game/03_Audio

          git archive origin/main -- state 2>/dev/null | tar -x || true
          git archive origin/main -- Assets/_Game/02_Art/Sprite 2>/dev/null | tar -x || true
          git archive origin/main -- Assets/_Game/03_Audio 2>/dev/null | tar -x || true

      - name: Retrieve new sprite files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_PERSONA: ${{ secrets.GEMINI_PERSONA }}
        run: |
          python retrieve.py \
            --drive-folder-id "${{ secrets.DRIVE_SPRITE_FOLDER_ID }}" \
            --service-account-b64 "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" \
            --state-file "state/sprite_manifest.json" \
            --download-dir "Assets/_Game/02_Art/Sprite" \
            --project-name "${{ github.repository }} (sprite)" \
            --discord-webhook "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Retrieve new audio files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_PERSONA: ${{ secrets.GEMINI_PERSONA }}
        run: |
          python retrieve.py \
            --drive-folder-id "${{ secrets.DRIVE_AUDIO_FOLDER_ID }}" \
            --service-account-b64 "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" \
            --state-file "state/audio_manifest.json" \
            --download-dir "Assets/_Game/03_Audio" \
            --project-name "${{ github.repository }} (audio)" \
            --discord-webhook "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Commit retrieved files to chore/asset
        id: commit
        env:
          BOT_GIT_USERNAME: ${{ vars.BOT_GIT_USERNAME || 'Utazumi Sakurako' }}
          BOT_GIT_EMAIL: ${{ vars.BOT_GIT_EMAIL || '45u35+UtazumiSakurako[bot]@users.noreply.github.com' }}
        run: |
          git config user.name "$BOT_GIT_USERNAME"
          git config user.email "$BOT_GIT_EMAIL"

          git fetch origin main

          WORKTREE=/tmp/chore-asset

          # Always recreate chore/asset from latest main.
          # This avoids inheriting the broken branch history/state.
          git branch -D chore/asset 2>/dev/null || true
          git push origin --delete chore/asset 2>/dev/null || true

          git worktree add -b chore/asset "$WORKTREE" origin/main

          mkdir -p \
            "$WORKTREE/state" \
            "$WORKTREE/Assets/_Game/02_Art/Sprite" \
            "$WORKTREE/Assets/_Game/03_Audio"

          cp -f state/*.json \
            "$WORKTREE/state/" 2>/dev/null || true

          cp -rf Assets/_Game/02_Art/Sprite/. \
            "$WORKTREE/Assets/_Game/02_Art/Sprite/" 2>/dev/null || true

          cp -rf Assets/_Game/03_Audio/. \
            "$WORKTREE/Assets/_Game/03_Audio/" 2>/dev/null || true

          cd "$WORKTREE"

          git add \
            state/ \
            Assets/_Game/02_Art/Sprite \
            Assets/_Game/03_Audio

          if git diff --cached --quiet; then
            echo "No changes, skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(assets): retrieve new drive files [skip ci]"
          git push origin HEAD:chore/asset

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/chore-asset

          TITLE="chore(assets): retrieve new drive files"
          BODY="Automated asset sync from Google Drive.

          Last updated: $(date -u +'%Y-%m-%d %H:%M UTC')"

          OPEN_PR=$(gh pr list \
            --head chore/asset \
            --state open \
            --repo "${{ github.repository }}" \
            --json number \
            --jq '.[0].number')

          if [ -n "$OPEN_PR" ]; then
            echo "Open PR #$OPEN_PR already exists, updating it."
            gh pr edit "$OPEN_PR" \
              --title "$TITLE" \
              --body "$BODY" \
              --repo "${{ github.repository }}"
          else
            echo "No open PR found, creating a new one."
            gh pr create \
              --base main \
              --head chore/asset \
              --title "$TITLE" \
              --body "$BODY" \
              --repo "${{ github.repository }}"
          fi


  # ============================================================
  # DISCORD FAILURE NOTIFICATION
  # ============================================================

  notify-failure:
    name: Notify Discord (Failure)

    needs:
      - retrieve

    if: failure()

    runs-on: ubuntu-latest

    steps:

      - name: Generate failure message with Gemini
        id: flavor

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_PERSONA: ${{ vars.GEMINI_PERSONA || 'You are a helpful assistant.' }}
          GEMINI_LANGUAGE: ${{ vars.GEMINI_LANGUAGE || '' }}

        shell: bash

        run: |
          set -e

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "${GEMINI_LANGUAGE}" ]; then
            LANGUAGE_INSTRUCTION="Write the response in ${GEMINI_LANGUAGE}."
          else
            LANGUAGE_INSTRUCTION="Write the response in the same language used in the persona instructions above."
          fi

          PROMPT="${GEMINI_PERSONA}

          Write ONE short paragraph (maximum 3 sentences, no markdown formatting, no surrounding quotation marks) announcing that the automated Drive file retrieval workflow for repository \"${{ github.repository }}\" has FAILED.

          Include the workflow run URL: ${RUN_URL}
          ${LANGUAGE_INSTRUCTION}"

          BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text: $prompt
                    }
                  ]
                }
              ]
            }')

          RESPONSE=$(curl -sS -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          TEXT=$(echo "$RESPONSE" | jq -r \
            '.candidates[0].content.parts[0].text // empty')

          if [ -z "$TEXT" ]; then
            echo "Gemini failed, using fallback message."
            TEXT="Retrieve drive files untuk ${{ github.repository }} gagal. Sila cek log: ${RUN_URL}"
          fi

          {
            echo "text<<GEMINI_EOF"
            echo "$TEXT"
            echo "GEMINI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord failure notification

        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FLAVOR_TEXT: ${{ steps.flavor.outputs.text }}

        shell: bash

        run: |
          set -e

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg content "$FLAVOR_TEXT" \
            --arg title "Retrieve Failed — ${{ github.repository }}" \
            --arg url "$RUN_URL" \
            '{
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: $content,
                  color: 15548997
                }
              ]
            }')

          curl -sS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"